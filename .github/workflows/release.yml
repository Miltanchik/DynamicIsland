name: Build & Publish Dynamic Island Release (main/release/version.json)

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version_target:
        description: 'Версия: patch | minor | major | sync | или точный номер (например 3.2.1)'
        required: true
        default: 'patch'
      changelog:
        description: 'Описание изменений для version.json (необязательно — иначе соберётся из коммитов)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  publish-release:
    runs-on: windows-latest
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.ref }}
          fetch-depth: 30

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build x64 Binaries & Generate release/version.json
        shell: pwsh
        env:
          INPUT_TARGET: ${{ github.event.inputs.version_target }}
          INPUT_NOTES: ${{ github.event.inputs.changelog }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if ($env:EVENT_NAME -eq 'push' -and $env:REF_NAME -match '^v(\d+\.\d+\.\d+)') {
              $target = $Matches[1]
          } elseif ([string]::IsNullOrWhiteSpace($env:INPUT_TARGET)) {
              $target = "sync"
          } else {
              $target = $env:INPUT_TARGET.Trim()
          }

          if ([string]::IsNullOrWhiteSpace($env:INPUT_NOTES)) {
              python tools/publish_release.py $target --repo "${{ github.repository }}" --no-push
          } else {
              python tools/publish_release.py $target -m "$env:INPUT_NOTES" --repo "${{ github.repository }}" --no-push
          }

      - name: Commit & Push Updated release/version.json and Binaries to main
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          $ver = (Get-Content "release/version.json" -Raw | ConvertFrom-Json).version
          git add NativeDynamicIsland.cs NativeInstaller.cs release/
          $staged = git diff --cached --name-only
          if ($staged) {
              git commit -m "chore(release): publish Dynamic Island v$ver [skip ci]"
              git pull --rebase origin main
              git push origin HEAD:main
          }

      - name: Attach Artifacts to GitHub Release (on tag push)
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            release/DynamicIslandWin_Setup.exe
            release/DinamicIsland-Setup.exe
            release/DynamicIslandWin.exe
            release/SHA256SUMS.txt
            release/version.json